<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>住まいのしおり 掲示物 3棟</title>
<style>
  /* 1面＝80 × 129.4mm（黄金比 1:1.618・幅8cm基準）
     A4に2列×2段で中央に配置。左上Ⅲ／右上Ⅱ／左下ラヴィール／右下は余白。 */
  @page{ size:A4; margin:0; }
  :root{
    --brown:#7d6a55;
    --brown-d:#5e4f3f;
    --line:#e3ded6;
    --sub:#6b6357;
    --ink:#2b2b2b;
    --cw:80mm;      /* 1面の幅 */
    --ch:129.4mm;   /* 1面の高さ＝80mm×1.618 */
    --ml:25mm;      /* 左余白＝(210-160)/2 */
    --mt:19.1mm;    /* 上余白＝(297-258.8)/2 */
  }
  *{box-sizing:border-box;margin:0;padding:0;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  html,body{width:210mm;height:297mm;}
  body{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;background:#fff;}
  .mincho{font-family:"Noto Serif JP","Yu Mincho","YuMincho",serif;}

  .sheet{width:210mm;height:297mm;position:relative;}

  /* 切り取りの目安＝紙を端から端まで切れるように、線は全幅・全高で引く */
  .cut{position:absolute;pointer-events:none;}
  .cut.v{top:0;height:297mm;width:0;border-left:.3pt dashed #cfcac2;}
  .cut.h{left:0;width:210mm;height:0;border-top:.3pt dashed #cfcac2;}

  .card{
    position:absolute;width:var(--cw);height:var(--ch);
    padding:7mm 6mm 6mm;
    display:flex;flex-direction:column;text-align:center;background:#fff;
    overflow:hidden;   /* 🔴 写真の帯が左右にはみ出す指定なので、面の外へ出さない */
  }
  /* 🔴 flex:none が無いと、高さが足りないときに黙って0まで潰される（2026-09-08に実際に起きた） */
  .bar{flex:none;width:13mm;height:1.2mm;background:var(--brown);border-radius:1mm;margin:0 auto 3.5mm;}
  h1{flex:none;font-size:18pt;letter-spacing:.18em;color:var(--brown-d);font-weight:500;
     text-indent:.18em;line-height:1.4;white-space:nowrap;}
  .sub{flex:none;font-size:8pt;letter-spacing:.14em;color:var(--sub);margin-top:2.2mm;text-indent:.14em;}

  .qrbox{
    flex:none;margin:4mm auto 0;width:42mm;height:42mm;padding:2.6mm;background:#fff;
    border:.6pt solid var(--line);border-radius:3mm;
  }
  .qrbox img{width:100%;height:100%;display:block;image-rendering:pixelated;}

  .scan{flex:none;font-size:8.5pt;color:var(--ink);margin-top:3mm;line-height:1.75;}
  .scan b{font-weight:700;}

  .strip{flex:none;margin:3.5mm -6mm 0;height:11mm;overflow:hidden;}
  .strip img{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block;}

  .foot{flex:none;margin-top:auto;padding-top:3mm;}
  .bldname{
    display:inline-block;font-size:10.5pt;font-weight:700;color:#fff;background:var(--brown);
    padding:2.2mm 6mm;border-radius:99mm;letter-spacing:.05em;white-space:nowrap;
  }
  .tel{font-size:6.5pt;color:var(--sub);margin-top:2.6mm;letter-spacing:.03em;white-space:nowrap;}
</style>
</head>
<body>
<div class="sheet">
  <div class="cut v" style="left:25mm"></div>
  <div class="cut v" style="left:105mm"></div>
  <div class="cut v" style="left:185mm"></div>
  <div class="cut h" style="top:19.1mm"></div>
  <div class="cut h" style="top:148.5mm"></div>
  <div class="cut h" style="top:277.9mm"></div>

  <!-- 左上 -->
  <div class="card" style="left:25mm;top:19.1mm">
    <div class="bar"></div>
    <h1 class="mincho">住まいのしおり</h1>
    <p class="sub">くらしのご案内</p>
    <div class="qrbox"><img src="qr_f3.png" alt=""></div>
    <p class="scan">スマートフォンのカメラを<br><b>かざすだけ</b>でご覧いただけます</p>
    <div class="strip"><img src="room.jpg" alt=""></div>
    <div class="foot">
      <span class="bldname">ファミーユ豊玉Ⅲ</span>
      <p class="tel">お問い合わせ　邑ハウジング　03-3948-0101</p>
    </div>
  </div>

  <!-- 右上 -->
  <div class="card" style="left:105mm;top:19.1mm">
    <div class="bar"></div>
    <h1 class="mincho">住まいのしおり</h1>
    <p class="sub">くらしのご案内</p>
    <div class="qrbox"><img src="qr_f2.png" alt=""></div>
    <p class="scan">スマートフォンのカメラを<br><b>かざすだけ</b>でご覧いただけます</p>
    <div class="strip"><img src="room.jpg" alt=""></div>
    <div class="foot">
      <span class="bldname">ファミーユ豊玉Ⅱ</span>
      <p class="tel">お問い合わせ　邑ハウジング　03-3948-0101</p>
    </div>
  </div>

  <!-- 左下 -->
  <div class="card" style="left:25mm;top:148.5mm">
    <div class="bar"></div>
    <h1 class="mincho">住まいのしおり</h1>
    <p class="sub">くらしのご案内</p>
    <div class="qrbox"><img src="qr_lv.png" alt=""></div>
    <p class="scan">スマートフォンのカメラを<br><b>かざすだけ</b>でご覧いただけます</p>
    <div class="strip"><img src="room.jpg" alt=""></div>
    <div class="foot">
      <span class="bldname">ラヴィール豊玉</span>
      <p class="tel">お問い合わせ　邑ハウジング　03-3948-0101</p>
    </div>
  </div>

  <!-- 右下は余白 -->
</div>
</body>
</html>
